<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conway's Game of Life</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : application plein ecran. En-tete compact (nom + compteurs), culture
   de cellules bord a bord au centre, barre de commandes tactile en bas.
   Un seul univers visuel, sombre, comme un champ de microscope. */
:root {
  color-scheme: dark;
  --encre: #0e1320;      /* fond de la culture */
  --panneau: #171e2e;    /* barres et feuilles */
  --trait: #29334a;      /* quadrillage, bordures */
  --texte: #e8ebf2;
  --sourdine: #8d98b0;
  --cellule: #ffcf5c;    /* cellules vivantes */
  --actif: #62c9ff;      /* commande active */
  --titre: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --donnee: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--encre); color: var(--texte);
  font-family: var(--titre); font-size: 15px;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px;
  padding: 10px 16px; background: var(--panneau); border-bottom: 1px solid var(--trait);
}
h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
h1 small { font-family: var(--donnee); font-size: 12px; font-weight: 400; color: var(--sourdine); margin-left: 8px; }
.compteurs { display: flex; gap: 18px; margin-left: auto; font-family: var(--donnee); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--sourdine); }
.compteurs b { color: var(--texte); font-weight: 600; }
.culture { position: relative; flex: 1; min-height: 0; }
#toile { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.astuce, .annonce {
  position: absolute; left: 16px; right: 16px; pointer-events: none;
  font-family: var(--donnee); font-size: 12px; color: var(--sourdine);
}
.astuce { bottom: 10px; }
.astuce .tactile { display: none; }
@media (pointer: coarse) { .astuce .souris { display: none; } .astuce .tactile { display: inline; } }
.annonce { top: 12px; display: flex; justify-content: center; }
.annonce span { background: var(--cellule); color: var(--encre); font-family: var(--titre); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 999px; }
.commandes {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--panneau); border-top: 1px solid var(--trait);
}
button, .vitesse {
  font: 500 14px var(--titre); color: var(--texte);
  background: var(--encre); border: 1px solid var(--trait); border-radius: 8px;
  min-height: 40px; padding: 0 12px;
}
button { cursor: pointer; }
button:hover { border-color: var(--sourdine); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--actif); outline-offset: 2px; }
button.principal { background: var(--cellule); color: var(--encre); border-color: var(--cellule); font-weight: 700; min-width: 92px; }
button[aria-pressed="true"] { background: var(--actif); color: var(--encre); border-color: var(--actif); font-weight: 700; }
.groupe { display: flex; }
.groupe button { border-radius: 0; margin-left: -1px; }
.groupe button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.groupe button:last-child { border-radius: 0 8px 8px 0; }
.vitesse { display: flex; align-items: center; gap: 8px; flex: 1 1 170px; min-width: 0; color: var(--sourdine); font-size: 13px; }
.vitesse input { flex: 1; min-width: 0; accent-color: var(--cellule); }
.vitesse output { font-family: var(--donnee); color: var(--texte); min-width: 3ch; text-align: right; }
.feuille {
  position: absolute; inset: 0; z-index: 5; background: rgb(8 11 20 / 0.72);
  display: flex; align-items: flex-end; justify-content: center;
}
.feuille > div {
  width: 100%; max-width: 620px; max-height: 88%; overflow-y: auto;
  background: var(--panneau); border: 1px solid var(--trait); border-bottom: 0;
  border-radius: 16px 16px 0 0; padding: 16px calc(16px) calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.feuille .tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.feuille h2 { margin: 0; font-size: 18px; }
.liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.liste button { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; text-align: left; height: 100%; font-weight: 700; }
.liste .texte { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.liste canvas.apercu { width: 64px; height: 64px; flex: none; border-radius: 6px; }
.liste button span { font: 400 12px var(--donnee); color: var(--sourdine); }
label.option { display: flex; align-items: center; gap: 8px; color: var(--sourdine); font-size: 14px; }
label.option input { width: 18px; height: 18px; accent-color: var(--cellule); }
.coller { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--trait); padding-top: 14px; }
.coller label { font-weight: 700; }
.coller p { margin: 0; color: var(--sourdine); font-size: 13px; }
textarea { font: 13px var(--donnee); color: var(--texte); background: var(--encre); border: 1px solid var(--trait); border-radius: 8px; padding: 10px; min-height: 76px; resize: vertical; width: 100%; box-sizing: border-box; }
.erreur { color: #ff9a8a; font-size: 13px; margin: 0; }
</style>
</head>
<body>


<header>
  <h1>Game of Life <small>B3/S23 · <span id="moteurNom">…</span></small></h1>
  <div class="compteurs">
    <span>Generation <b id="gen">0</b></span>
    <span>Population <b id="pop">0</b></span>
  </div>
</header>

<div class="culture" id="culture">
  <canvas id="toile" aria-label="Game of Life grid"></canvas>
  <div class="annonce" id="annonce" hidden><span id="annonceTexte"></span></div>

  <div class="feuille" id="feuille" hidden>
    <div role="dialog" aria-labelledby="feuilleTitre">
      <div class="tete">
        <h2 id="feuilleTitre">Choose a pattern</h2>
        <button id="fermer" type="button">Close</button>
      </div>
      <label class="option"><input type="checkbox" id="vider" checked> Clear the grid before placing the pattern</label>
      <div class="liste" id="liste"></div>
      <div class="coller">
        <label for="rle">Paste a pattern from the conwaylife.com wiki</label>
        <p>Copy the RLE code from a wiki page, for example <code>bob$2bo$3o!</code></p>
        <textarea id="rle" spellcheck="false" autocapitalize="off"></textarea>
        <p class="erreur" id="erreur" hidden>This text doesn't contain a readable pattern (RLE or .cells format).</p>
        <button id="poserRle" type="button">Place this pattern</button>
      </div>
    </div>
  </div>
</div>

<div class="commandes">
  <button class="principal" id="lecture" type="button">Pause</button>
  <button id="pas" type="button" title="Advance one generation">+1</button>
  <div class="groupe" role="group" aria-label="Tool">
    <button id="outilMain" type="button" aria-pressed="true">Move</button>
    <button id="outilDessin" type="button" aria-pressed="false">Draw</button>
  </div>
  <button id="motifs" type="button">Patterns</button>
  <div class="groupe" role="group" aria-label="Zoom">
    <button id="zoomMoins" type="button" aria-label="Zoom out">−</button>
    <button id="cadrer" type="button">Fit</button>
    <button id="zoomPlus" type="button" aria-label="Zoom in">+</button>
  </div>
  <button id="hasard" type="button">Random</button>
  <button id="effacer" type="button">Clear</button>
  <div class="vitesse">
    <label for="vitesse">Speed</label>
    <input id="vitesse" type="range" min="1" max="240" value="12">
    <output id="vitesseTexte" for="vitesse">12</output>
  </div>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- Motifs
const MOTIFS = [
  ["Glider", "moves diagonally", "bob$2bo$3o!"],
  ["Lightweight spaceship", "LWSS, travels in a straight line", "o2bo$4bo$o3bo$b4o!"],
  ["Pulsar", "period-3 oscillator", "2b3o3b3o2b2$o4bobo4bo$o4bobo4bo$o4bobo4bo$2b3o3b3o2b2$2b3o3b3o2b$o4bobo4bo$o4bobo4bo$o4bobo4bo2$2b3o3b3o!"],
  ["R-pentomino", "5 cells, 1103 generations", "b2o$2o$bo!"],
  ["Acorn", "7 cells, 5206 generations", "bo5b$3bo3b$2o2b3o!"],
  ["Diehard", "7 cells, dies out after 130", "6bob$2o6b$bo3b3o!"],
  ["Gosper glider gun", "a glider every 30 generations", "24bo11b$22bobo11b$12b2o6b2o12b2o$11bo3bo4b2o12b2o$2o8bo5bo3b2o14b$2o8bo3bob2o4bobo11b$10bo5bo7bo11b$11bo3bo20b$12b2o!"],
  ["Copperhead", "slow spaceship, found in 2016", "b2o2b2o$3b2o$3b2o$obo2bobo$o6bo2$o6bo$b2o2b2o$2b4o2$3b2o$3b2o!"],
];

// Lit un motif RLE ou plaintext (.cells) -> liste de [x, y], ou null.
function lireMotif(texte) {
  const brut = texte.replace(/\r/g, "").split("\n");
  const lignes = brut.map(l => l.trim()).filter(l => l);
  const entete = lignes.some(l => /^x\s*=/.test(l));
  const corps = lignes.filter(l => !/^[#!]/.test(l) && !/^x\s*=/.test(l)).join("");
  const estRle = entete || (corps.includes("o") && /^[0-9bo$!\s]+$/.test(corps));
  const cellules = [];
  if (estRle) {
    let nombre = "", x = 0, y = 0;
    for (const c of corps) {
      if (c >= "0" && c <= "9") { nombre += c; continue; }
      if (c === "!") break;
      if (/\s/.test(c)) continue;
      const n = nombre ? parseInt(nombre, 10) : 1; nombre = "";
      if (c === "$") { y += n; x = 0; }
      else if (c === "b" || c === ".") x += n;
      else if (/[a-zA-Z]/.test(c)) { for (let i = 0; i < n; i++) cellules.push([x + i, y]); x += n; }
      else return null;
    }
  } else {
    let y = 0;
    for (let ligne of brut) {
      if (ligne.startsWith("!")) continue;
      ligne = ligne.replace(/\s+$/, "");
      if (ligne && !/^[.O*o ]+$/.test(ligne)) return null;
      for (let x = 0; x < ligne.length; x++) if ("O*o".includes(ligne[x])) cellules.push([x, y]);
      y++;
    }
  }
  if (!cellules.length || cellules.length > 2000000) return null;
  let x0 = Infinity, y0 = Infinity;
  for (const [x, y] of cellules) { if (x < x0) x0 = x; if (y < y0) y0 = y; }
  return cellules.map(([x, y]) => [x - x0, y - y0]);
}

const hexVersVec = h => { h = h.trim().replace("#", ""); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); };
const styles = getComputedStyle(document.documentElement);
const COULEUR = n => styles.getPropertyValue(n).trim();
const C_FOND = COULEUR("--encre"), C_TRAIT = COULEUR("--trait"), C_CELLULE = COULEUR("--cellule");

// ================================================ Moteur (grille infinie)
// L'univers n'a pas de bord : il est decoupe en tuiles de 32 x 32 cellules et
// on ne garde en memoire que les tuiles qui contiennent des cellules vivantes.
// Une ligne de tuile tient dans un entier de 32 bits (bit i = colonne i), ce qui
// permet de calculer 32 cellules a la fois avec des operations bit a bit.
function creerMoteur(toile) {
  const ctx = toile.getContext("2d");
  const T = 32, OFF = 2 ** 25, SPAN = 2 ** 26;     // tuiles de -2^25 a 2^25 : environ ±1 milliard de cellules
  const cle = (tx, ty) => (tx + OFF) * SPAN + (ty + OFF);
  const cleX = k => Math.floor(k / SPAN) - OFF, cleY = k => k % SPAN - OFF;
  const dansMonde = (tx, ty) => tx > -OFF && tx < OFF - 1 && ty > -OFF && ty < OFF - 1;
  const VIDE = new Int32Array(T);
  let tuiles = new Map();                          // cle -> Int32Array(32)
  let reserve = [], version = 0;                   // tableaux recycles ; version change a chaque modification
  const nouvelle = () => reserve.pop() || new Int32Array(T);
  const popcount = v => {
    v = v - ((v >>> 1) & 0x55555555); v = (v & 0x33333333) + ((v >>> 2) & 0x33333333);
    return Math.imul((v + (v >>> 4)) & 0x0F0F0F0F, 0x01010101) >>> 24;
  };

  // Une generation. Les cellules voisines sont additionnees en parallele sur les
  // 32 bits d'une ligne (additionneurs bit a bit), puis on applique B3/S23.
  function avancer() {
    const candidates = new Set();
    for (const [k, t] of tuiles) {                 // une tuile vide peut naitre a cote d'un bord occupe
      candidates.add(k);
      let ou = 0; for (let j = 0; j < T; j++) ou |= t[j];
      const h = t[0], b = t[T - 1];
      if (h) candidates.add(k - 1);
      if (b) candidates.add(k + 1);
      if (ou & 1) candidates.add(k - SPAN);
      if (ou >>> 31) candidates.add(k + SPAN);
      if (h & 1) candidates.add(k - SPAN - 1);
      if (h >>> 31) candidates.add(k + SPAN - 1);
      if (b & 1) candidates.add(k - SPAN + 1);
      if (b >>> 31) candidates.add(k + SPAN + 1);
    }
    const g = k => tuiles.get(k) || VIDE, suivantes = new Map();
    for (const k of candidates) {
      if (!dansMonde(cleX(k), cleY(k))) continue;
      const c = g(k), su = g(k + 1), w = g(k - SPAN), e = g(k + SPAN), sw = g(k - SPAN + 1), se = g(k + SPAN + 1);
      const no = g(k - 1), nw = g(k - SPAN - 1), ne = g(k + SPAN - 1);
      const r = nouvelle();
      let tout = 0;
      let ac = no[T - 1], aw = nw[T - 1], ae = ne[T - 1];   // ligne du dessus
      let mc = c[0], mw = w[0], me = e[0];                  // ligne courante
      for (let j = 0; j < T; j++) {
        let bc, bw, be;                                     // ligne du dessous
        if (j < T - 1) { bc = c[j + 1]; bw = w[j + 1]; be = e[j + 1]; } else { bc = su[0]; bw = sw[0]; be = se[0]; }
        const a1 = (ac << 1) | (aw >>> 31), a3 = (ac >>> 1) | (ae << 31);
        const m1 = (mc << 1) | (mw >>> 31), m3 = (mc >>> 1) | (me << 31);
        const b1 = (bc << 1) | (bw >>> 31), b3 = (bc >>> 1) | (be << 31);
        const xa = a1 ^ ac, sa = xa ^ a3, ca = (a1 & ac) | (xa & a3);   // 3 voisines du dessus
        const sm = m1 ^ m3, cm = m1 & m3;                                // 2 voisines de cote
        const xb = b1 ^ bc, sb = xb ^ b3, cb = (b1 & bc) | (xb & b3);   // 3 voisines du dessous
        const xs = sa ^ sm, un = xs ^ sb, k1 = (sa & sm) | (xs & sb);
        const deux = ca ^ cm ^ cb ^ k1;
        const plus = (ca & cm) | (ca & cb) | (ca & k1) | (cm & cb) | (cm & k1) | (cb & k1);
        const v = deux & ~plus & (un | mc);   // 3 voisines, ou 2 voisines et deja vivante
        r[j] = v; tout |= v;
        ac = mc; aw = mw; ae = me; mc = bc; mw = bw; me = be;
      }
      if (tout) suivantes.set(k, r); else reserve.push(r);
    }
    for (const t of tuiles.values()) reserve.push(t);
    tuiles = suivantes; version++;
  }

  function marquer(x, y, v) {
    const tx = Math.floor(x / T), ty = Math.floor(y / T);
    if (!dansMonde(tx, ty)) return;
    const k = cle(tx, ty), bit = 1 << (x - tx * T), j = y - ty * T;
    let t = tuiles.get(k);
    if (v) {
      if (!t) { t = nouvelle(); t.fill(0); tuiles.set(k, t); }
      t[j] |= bit;
    } else if (t) {
      t[j] &= ~bit;
      if (t.every(r => r === 0)) { tuiles.delete(k); reserve.push(t); }
    }
    version++;
  }
  function effacer() { tuiles = new Map(); reserve = []; version++; }

  // Appelle f(tx, ty, tuile) pour chaque tuile qui touche le rectangle de cellules [x1, x2[ x [y1, y2[.
  function visiter(x1, y1, x2, y2, f) {
    const tx1 = Math.floor(x1 / T), tx2 = Math.floor((x2 - 1) / T), ty1 = Math.floor(y1 / T), ty2 = Math.floor((y2 - 1) / T);
    if ((tx2 - tx1 + 1) * (ty2 - ty1 + 1) <= tuiles.size) {
      for (let tx = tx1; tx <= tx2; tx++) for (let ty = ty1; ty <= ty2; ty++) {
        if (!dansMonde(tx, ty)) continue;
        const t = tuiles.get(cle(tx, ty)); if (t) f(tx, ty, t);
      }
    } else for (const [k, t] of tuiles) {
      const tx = cleX(k), ty = cleY(k);
      if (tx >= tx1 && tx <= tx2 && ty >= ty1 && ty <= ty2) f(tx, ty, t);
    }
  }

  // Affichage : on remplit une image (une case = un pixel, ou un pixel de l'ecran
  // si on est tres dezoome), puis on l'agrandit sans lissage.
  const vers32 = h => { const [r, g, b] = hexVersVec(h).map(c => Math.round(c * 255)); return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0; };
  const FOND = vers32(C_FOND), CELL = vers32(C_CELLULE);
  const tampon = document.createElement("canvas"), tctx = tampon.getContext("2d");
  let image = null, pixels = null, derniereVue = "";
  function preparer(l, h) {
    if (!image || image.width !== l || image.height !== h) { image = new ImageData(l, h); pixels = new Uint32Array(image.data.buffer); }
    pixels.fill(FOND);
  }

  let cache = { population: 0 }, versionCompte = -1, dernierCompte = -1e9;
  const moteur = {
    nom: "infinite grid", limiteHasard: 2048,
    redimensionner(dpr) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); derniereVue = ""; },
    avancer,
    lire(x, y) {
      const tx = Math.floor(x / T), ty = Math.floor(y / T);
      if (!dansMonde(tx, ty)) return false;
      const t = tuiles.get(cle(tx, ty));
      return !!t && ((t[y - ty * T] >>> (x - tx * T)) & 1) === 1;
    },
    marquer,
    poser(cellules, x0, y0) { for (const [x, y] of cellules) marquer(x0 + x, y0 + y, true); return true; },
    effacer,
    remplir(x0, y0, l, h, densite) {
      effacer();
      for (let y = 0; y < h; y++) for (let x = 0; x < l; x++) if (Math.random() < densite) marquer(x0 + x, y0 + y, true);
    },
    // Population, recalculee au plus ~3 fois par seconde.
    statistiques(force) {
      const t = performance.now();
      if (!force && (versionCompte === version || t - dernierCompte < 300)) return cache;
      let pop = 0;
      for (const tu of tuiles.values()) for (let j = 0; j < T; j++) if (tu[j]) pop += popcount(tu[j]);
      cache = { population: pop }; versionCompte = version; dernierCompte = t;
      return cache;
    },
    bornes() {
      if (!tuiles.size) return null;
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const [k, t] of tuiles) {
        const bx = cleX(k) * T, by = cleY(k) * T;
        let ou = 0, j1 = -1, j2 = -1;
        for (let j = 0; j < T; j++) if (t[j]) { ou |= t[j]; if (j1 < 0) j1 = j; j2 = j; }
        x1 = Math.min(x1, bx + 31 - Math.clz32(ou & -ou)); x2 = Math.max(x2, bx + 31 - Math.clz32(ou));
        y1 = Math.min(y1, by + j1); y2 = Math.max(y2, by + j2);
      }
      return [x1, y1, x2, y2];
    },
    dessiner(v) {
      const vueCle = `${v.ox},${v.oy},${v.echelle},${v.largeur},${v.hauteur},${v.dpr},${version}`;
      if (vueCle === derniereVue) return;          // rien n'a change depuis la derniere image
      derniereVue = vueCle;
      const k = v.echelle * v.dpr;                 // pixels de l'ecran par cellule
      const xFin = v.ox + v.largeur / v.echelle, yFin = v.oy + v.hauteur / v.echelle;
      if (k >= 1) {
        // Une cellule = un pixel de l'image, agrandie ensuite.
        const cx0 = Math.floor(v.ox), cy0 = Math.floor(v.oy);
        const bw = Math.ceil(xFin) - cx0 + 1, bh = Math.ceil(yFin) - cy0 + 1;
        preparer(bw, bh);
        visiter(cx0, cy0, cx0 + bw, cy0 + bh, (tx, ty, t) => {
          const bx = tx * T - cx0, by = ty * T - cy0;
          for (let j = 0; j < T; j++) {
            let w = t[j]; const py = by + j;
            if (!w || py < 0 || py >= bh) continue;
            while (w) {
              const px = bx + 31 - Math.clz32(w & -w); w &= w - 1;
              if (px >= 0 && px < bw) pixels[py * bw + px] = CELL;
            }
          }
        });
        if (tampon.width !== bw || tampon.height !== bh) { tampon.width = bw; tampon.height = bh; }
        tctx.putImageData(image, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(tampon, (cx0 - v.ox) * v.echelle, (cy0 - v.oy) * v.echelle, bw * v.echelle, bh * v.echelle);
        if (v.echelle >= 6) {                      // quadrillage
          ctx.fillStyle = C_TRAIT;
          for (let x = cx0; x <= xFin; x++) ctx.fillRect(Math.floor((x - v.ox) * v.echelle), 0, 1, v.hauteur);
          for (let y = cy0; y <= yFin; y++) ctx.fillRect(0, Math.floor((y - v.oy) * v.echelle), v.largeur, 1);
        }
      } else {
        // Tres dezoome : plusieurs cellules par pixel, l'image a la taille de l'ecran.
        const bw = toile.width, bh = toile.height;
        preparer(bw, bh);
        const point = (x, y) => {
          const px = Math.floor((x - v.ox) * k), py = Math.floor((y - v.oy) * k);
          if (px >= 0 && px < bw && py >= 0 && py < bh) pixels[py * bw + px] = CELL;
        };
        visiter(Math.floor(v.ox), Math.floor(v.oy), Math.ceil(xFin) + 1, Math.ceil(yFin) + 1, (tx, ty, t) => {
          if (T * k <= 1) { point(tx * T + T / 2, ty * T + T / 2); return; }   // la tuile tient dans un pixel
          for (let j = 0; j < T; j++) {
            let w = t[j];
            while (w) { const b = 31 - Math.clz32(w & -w); w &= w - 1; point(tx * T + b, ty * T + j); }
          }
        });
        ctx.putImageData(image, 0, 0);
      }
    },
  };
  return moteur;
}

// ============================================================ Application
const $ = id => document.getElementById(id);
const culture = $("culture");
const toile = $("toile"), moteur = creerMoteur(toile);
$("moteurNom").textContent = moteur.nom;

const ZOOM_MAX = 48;
const vue = { echelle: 12, ox: 0, oy: 0, largeur: 0, hauteur: 0, dpr: 1 };
let pret = false, generation = 0;
let enCours = true, vitesse = 12, cumul = 0, dernier = 0;
let outil = "main", enAttente = null;   // motif a poser au prochain toucher

const zoomMin = () => 0.01;
function zoomer(px, py, facteur) {
  const wx = px / vue.echelle + vue.ox, wy = py / vue.echelle + vue.oy;
  vue.echelle = Math.min(ZOOM_MAX, Math.max(zoomMin(), vue.echelle * facteur));
  vue.ox = wx - px / vue.echelle; vue.oy = wy - py / vue.echelle;
}
function cadrer() {
  const b = moteur.bornes();
  if (!b) { vue.echelle = 12; vue.ox = -vue.largeur / 24; vue.oy = -vue.hauteur / 24; return; }
  const [x1, y1, x2, y2] = b, l = x2 - x1 + 1, h = y2 - y1 + 1;
  vue.echelle = Math.min(16, Math.max(zoomMin(), Math.min(vue.largeur / (l + 12), vue.hauteur / (h + 12))));
  vue.ox = (x1 + x2 + 1) / 2 - vue.largeur / vue.echelle / 2;
  vue.oy = (y1 + y2 + 1) / 2 - vue.hauteur / vue.echelle / 2;
}
function poserCentre(cellules, cx, cy) {
  let l = 0, h = 0;
  for (const [x, y] of cellules) { if (x >= l) l = x + 1; if (y >= h) h = y + 1; }
  return moteur.poser(cellules, Math.round(cx - l / 2), Math.round(cy - h / 2));
}
function avancer() { moteur.avancer(); generation++; }

function boucle(t) {
  const dt = Math.min(0.1, (t - dernier) / 1000); dernier = t;
  if (enCours && !document.hidden) {
    cumul += dt;
    const debut = performance.now();
    while (cumul >= 1 / vitesse) {
      avancer(); cumul -= 1 / vitesse;
      if (performance.now() - debut > 30) { cumul = 0; break; }   // appareil sature : on ralentit
    }
  } else cumul = 0;
  moteur.dessiner(vue);
  $("pop").textContent = moteur.statistiques(false).population.toLocaleString("en-US");
  $("gen").textContent = generation.toLocaleString("en-US");
  requestAnimationFrame(boucle);
}

function redimensionner() {
  const r = culture.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (!r.width || !r.height) return;
  const cx = vue.ox + vue.largeur / vue.echelle / 2, cy = vue.oy + vue.hauteur / vue.echelle / 2;
  vue.largeur = r.width; vue.hauteur = r.height; vue.dpr = dpr;
  toile.width = Math.round(r.width * dpr); toile.height = Math.round(r.height * dpr);
  moteur.redimensionner(dpr);
  if (!pret) { pret = true; vue.echelle = Math.min(14, Math.max(5, vue.largeur / 46)); vue.ox = -5; vue.oy = -4; }
  else {
    vue.echelle = Math.max(vue.echelle, zoomMin());
    vue.ox = cx - vue.largeur / vue.echelle / 2; vue.oy = cy - vue.hauteur / vue.echelle / 2;
  }
  moteur.dessiner(vue);              // changer la taille de la toile l'efface : on redessine tout de suite
}

// ------------------------------------------------------------ Commandes
function reglerLecture(etat) { enCours = etat; $("lecture").textContent = enCours ? "Pause" : "Play"; }
function reglerOutil(nom) {
  outil = nom;
  $("outilDessin").setAttribute("aria-pressed", nom === "dessin");
  $("outilMain").setAttribute("aria-pressed", nom === "main");
  toile.style.cursor = nom === "main" ? "grab" : "crosshair";
}
let minuterieAnnonce = 0;
function annoncer(texte, duree) {
  $("annonce").hidden = !texte; $("annonceTexte").textContent = texte || "";
  clearTimeout(minuterieAnnonce);
  if (texte && duree) minuterieAnnonce = setTimeout(() => annoncer(""), duree);
}
const centreVue = () => [vue.ox + vue.largeur / vue.echelle / 2, vue.oy + vue.hauteur / vue.echelle / 2];

$("lecture").onclick = () => reglerLecture(!enCours);
$("pas").onclick = () => { reglerLecture(false); avancer(); };
$("outilDessin").onclick = () => reglerOutil("dessin");
$("outilMain").onclick = () => reglerOutil("main");
$("zoomPlus").onclick = () => zoomer(vue.largeur / 2, vue.hauteur / 2, 1.4);
$("zoomMoins").onclick = () => zoomer(vue.largeur / 2, vue.hauteur / 2, 1 / 1.4);
$("cadrer").onclick = cadrer;
$("effacer").onclick = () => { moteur.effacer(); generation = 0; reglerLecture(false); };
$("hasard").onclick = () => {
  const lim = moteur.limiteHasard;
  const l = Math.min(lim, Math.ceil(vue.largeur / vue.echelle)), h = Math.min(lim, Math.ceil(vue.hauteur / vue.echelle));
  const [cx, cy] = centreVue();
  moteur.remplir(Math.round(cx - l / 2), Math.round(cy - h / 2), l, h, 0.3);
  generation = 0;
};
$("vitesse").oninput = e => { vitesse = +e.target.value; $("vitesseTexte").textContent = vitesse; };

// Feuille des motifs
function ouvrirFeuille(etat) { $("feuille").hidden = !etat; $("erreur").hidden = true; }
function choisir(cellules, nom) {
  ouvrirFeuille(false);
  if ($("vider").checked) {
    moteur.effacer(); generation = 0; reglerLecture(false);
    annoncer("");
    if (poserCentre(cellules, ...centreVue())) cadrer();
  } else { enAttente = cellules; annoncer("Tap the grid to place: " + nom); }
}
$("motifs").onclick = () => ouvrirFeuille(true);
$("fermer").onclick = () => ouvrirFeuille(false);
$("feuille").onclick = e => { if (e.target === $("feuille")) ouvrirFeuille(false); };
// Petit schema du motif, dessine a partir de ses cellules.
function miniature(cellules, nom) {
  const COTE_PX = 64, dpr = Math.min(window.devicePixelRatio || 1, 3);
  const c = document.createElement("canvas");
  c.className = "apercu"; c.width = c.height = Math.round(COTE_PX * dpr);
  c.setAttribute("role", "img"); c.setAttribute("aria-label", "Diagram of " + nom);
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  let l = 0, h = 0;
  for (const [x, y] of cellules) { if (x >= l) l = x + 1; if (y >= h) h = y + 1; }
  const n = Math.max(l, h) + 2;                       // une case de marge autour
  const t = (COTE_PX - 4) / n;                        // taille d'une case
  const x0 = (COTE_PX - l * t) / 2, y0 = (COTE_PX - h * t) / 2;
  g.fillStyle = C_FOND; g.fillRect(0, 0, COTE_PX, COTE_PX);
  if (t >= 4) {                                       // quadrillage si les cases sont assez grandes
    g.fillStyle = C_TRAIT;
    for (let i = -1; i <= l + 1; i++) g.fillRect(x0 + i * t, y0 - t, 1, (h + 2) * t);
    for (let j = -1; j <= h + 1; j++) g.fillRect(x0 - t, y0 + j * t, (l + 2) * t, 1);
  }
  g.fillStyle = C_CELLULE;
  const m = t >= 4 ? 1 : 0;
  for (const [x, y] of cellules) g.fillRect(x0 + x * t + m, y0 + y * t + m, Math.max(1, t - m), Math.max(1, t - m));
  return c;
}
for (const [nom, detail, rle] of MOTIFS) {
  const cellules = lireMotif(rle);
  const b = document.createElement("button"); b.type = "button";
  const texte = document.createElement("div"); texte.className = "texte"; texte.textContent = nom;
  const s = document.createElement("span"); s.textContent = detail; texte.appendChild(s);
  b.append(miniature(cellules, nom), texte);
  b.onclick = () => choisir(cellules, nom);
  $("liste").appendChild(b);
}
$("poserRle").onclick = () => {
  const cellules = lireMotif($("rle").value);
  if (!cellules) { $("erreur").hidden = false; return; }
  choisir(cellules, "pasted pattern");
  $("rle").value = "";            // le code est effacé une fois le motif pris en compte
};

// ------------------------------------------- Souris, doigts et clavier
const pointeurs = new Map();
let geste = null;      // {type: "trait", ajoute, x, y} | {type: "main"} | {type: "pince", d, mx, my}
const position = e => { const r = toile.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
const caseSous = (px, py) => [Math.floor(px / vue.echelle + vue.ox), Math.floor(py / vue.echelle + vue.oy)];
function pince() {
  const [a, b] = [...pointeurs.values()];
  return { type: "pince", d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 };
}

toile.addEventListener("pointerdown", e => {
  toile.setPointerCapture(e.pointerId);
  const p = position(e); pointeurs.set(e.pointerId, p);
  if (pointeurs.size === 2) { geste = pince(); return; }
  if (pointeurs.size > 2) return;
  if (enAttente && e.button === 0) {
    if (poserCentre(enAttente, p[0] / vue.echelle + vue.ox, p[1] / vue.echelle + vue.oy)) annoncer("");
    enAttente = null; geste = null; return;
  }
  if (e.button !== 0 || outil === "main") { geste = { type: "main" }; return; }
  const [x, y] = caseSous(...p), ajoute = !moteur.lire(x, y);
  moteur.marquer(x, y, ajoute); geste = { type: "trait", ajoute, x, y };
});
toile.addEventListener("pointermove", e => {
  if (!pointeurs.has(e.pointerId)) return;
  const avant = pointeurs.get(e.pointerId), p = position(e); pointeurs.set(e.pointerId, p);
  if (!geste) return;
  if (geste.type === "pince" && pointeurs.size === 2) {
    const n = pince();
    vue.ox -= (n.mx - geste.mx) / vue.echelle; vue.oy -= (n.my - geste.my) / vue.echelle;
    zoomer(n.mx, n.my, n.d / geste.d); geste = n;
  } else if (geste.type === "main") {
    vue.ox -= (p[0] - avant[0]) / vue.echelle; vue.oy -= (p[1] - avant[1]) / vue.echelle;
  } else if (geste.type === "trait") {
    const [x, y] = caseSous(...p);
    const n = Math.max(Math.abs(x - geste.x), Math.abs(y - geste.y));   // pas de trou si le geste est rapide
    for (let i = 1; i <= n; i++) moteur.marquer(Math.round(geste.x + (x - geste.x) * i / n), Math.round(geste.y + (y - geste.y) * i / n), geste.ajoute);
    geste.x = x; geste.y = y;
  }
});
function relacher(e) { pointeurs.delete(e.pointerId); geste = pointeurs.size === 1 && geste && geste.type === "pince" ? { type: "main" } : (pointeurs.size ? geste : null); }
toile.addEventListener("pointerup", relacher);
toile.addEventListener("pointercancel", relacher);
toile.addEventListener("contextmenu", e => e.preventDefault());
toile.addEventListener("wheel", e => { e.preventDefault(); zoomer(...position(e), e.deltaY < 0 ? 1.2 : 1 / 1.2); }, { passive: false });

window.addEventListener("keydown", e => {
  if (e.key === "Escape") { ouvrirFeuille(false); enAttente = null; annoncer(""); return; }
  if (e.target.matches("textarea, input, button") || !$("feuille").hidden) return;
  if (e.key === " ") { e.preventDefault(); reglerLecture(!enCours); }
  else if (e.key === "n" || e.key === "N") { reglerLecture(false); avancer(); }
  else if (e.key.startsWith("Arrow")) {
    const d = 60 / vue.echelle;
    if (e.key === "ArrowLeft") vue.ox -= d; if (e.key === "ArrowRight") vue.ox += d;
    if (e.key === "ArrowUp") vue.oy -= d; if (e.key === "ArrowDown") vue.oy += d;
    e.preventDefault();
  }
});

// ---------------------------------------------------------------- Depart
function demarrer() { moteur.effacer(); generation = 0; reglerLecture(false); }   // grille vide au lancement
reglerOutil("main");
demarrer();
new ResizeObserver(redimensionner).observe(culture);
redimensionner();
requestAnimationFrame(t => { dernier = t; requestAnimationFrame(boucle); });
</script>

</body>
</html>
